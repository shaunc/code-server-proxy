# code-server-proxy tmux configuration
# Used by cs-tmux-window for code-server terminal sessions

# No status bar — VS Code provides its own tab UI
set -g status off

# Large scrollback — survives reconnections
set -g history-limit 50000

# Don't destroy sessions when last client detaches
set -g destroy-unattached off

# Disable mouse — conflicts with VS Code terminal mouse
set -g mouse off

# Truecolor passthrough for VS Code terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Don't auto-rename windows
set -g automatic-rename off
